name: bubble-platform

services:
  detector:
    image: ghcr.io/cenyc/bubble-platform-detector:${IMAGE_TAG:-latest}
    build:
      context: ../DrawingBubbleService_M1
      dockerfile: ../Dockerfile.detector
    restart: unless-stopped
    environment:
      BUBBLE_API_KEY: ${BUBBLE_API_KEY:?Set BUBBLE_API_KEY in .env}
      BUBBLE_ENABLE_REALESRGAN: ${BUBBLE_ENABLE_REALESRGAN:-0}
    expose:
      - "8001"
    mem_limit: 4g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  web:
    image: ghcr.io/cenyc/bubble-platform-web:${IMAGE_TAG:-latest}
    build:
      context: ../web
      dockerfile: ../Dockerfile.web
    restart: unless-stopped
    depends_on:
      detector:
        condition: service_healthy
    environment:
      BUBBLE_API_URL: http://detector:8001
      BUBBLE_API_KEY: ${BUBBLE_API_KEY:?Set BUBBLE_API_KEY in .env}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3100}:3000"
    mem_limit: 768m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true
    healthcheck:
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
